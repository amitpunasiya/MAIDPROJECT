services:
  mongodb:
    image: mongo:7
    container_name: cook-maid-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-cook_maid_booking}
    volumes:
      - mongodb_data:/data/db
    networks:
      - cook-maid-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: cook-maid-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongodb:27017/${MONGO_DB_NAME:-cook_maid_booking}?authSource=admin
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cook-maid-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: cook-maid-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend
    networks:
      - cook-maid-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      target: development
    container_name: cook-maid-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-5174}:5174"
    env_file:
      - ./admin/.env
    volumes:
      - ./admin/src:/app/src
      - ./admin/index.html:/app/index.html
      - ./admin/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend
    networks:
      - cook-maid-network

volumes:
  mongodb_data:

networks:
  cook-maid-network:
    driver: bridge
